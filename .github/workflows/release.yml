name: Release

# Push a tag like v0.1.0 to build and publish a GitHub release with the
# binaries and SHA256SUMS attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: make dist VERSION=${{ github.ref_name }}
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/provisioning-linux-amd64 \
            dist/provisioning-linux-arm64 \
            dist/SHA256SUMS \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag
